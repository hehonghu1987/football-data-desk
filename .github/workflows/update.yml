name: 每日更新数据

on:
  schedule:
    # GitHub 的定时任务会延迟/漏跑，所以改成每 15 分钟机会式触发：
    # 每次先检查线上数据年龄，>22 分钟才真正构建，正常保持约 30 分钟一次部署。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 检查线上数据年龄
        id: check
        run: |
          python3 - <<'PY'
          import datetime, json, os, re, urllib.request
          skip = "false"
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule":
              url = ("https://hehonghu1987.github.io/football-data-desk/?v="
                     + str(int(datetime.datetime.now().timestamp())))
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "ignore")
                  m = re.search(r'"generatedAt":"([^"]+)"', html)
                  gen = datetime.datetime.fromisoformat(m.group(1).replace("Z", "+00:00"))
                  age = (datetime.datetime.now(datetime.timezone.utc) - gen).total_seconds() / 60
                  print(f"线上数据 {gen.isoformat()}，距今 {age:.0f} 分钟")
                  if age < 22:
                      skip = "true"
              except Exception as e:
                  print("检查失败，照常构建：", e)
          print("skip =", skip)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("skip=%s\n" % skip)
          PY

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复采集缓存
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - name: 采集数据并生成页面
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 build_data.py --workers 6 --rate 0.1

      - name: 保存采集缓存
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}

      - name: 校验数据完整性
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/matches.json'))
          meta = d['meta']
          stats = sum(1 for m in d['matches'] if m.get('stats') or m.get('st'))
          print(meta['matchCount'], meta['teamCount'], meta['fixtureCount'], stats)
          import os
          assert meta['matchCount'] >= 12000, '比赛数据不完整，放弃发布'
          assert meta['teamCount'] >= 600, '球队数据不完整，放弃发布'
          assert stats >= 12000, '技术统计不完整，放弃发布'
          size = os.path.getsize('football_database.html')
          print('页面体积 %.2f MB' % (size / 1024 / 1024))
          assert size < 10 * 1024 * 1024, '页面体积超过 10MB，放弃发布'
          PY

      - name: 生成静态球队页
        run: python3 build_seo.py

      - name: 生成每日简报
        run: python3 build_daily.py

      - name: 整理发布目录
        run: |
          mkdir -p dist
          cp football_database.html dist/index.html
          cp sw.js dist/sw.js
          cp robots.txt sitemap.xml og-image.png og-icon.png dist/
          if [ -d seo/teams ]; then
            cp -R seo/teams dist/teams
            cp seo/sitemap.xml dist/sitemap.xml
          fi
          if [ -d seo/matches ]; then
            cp -R seo/matches dist/matches
          fi
          if [ -d daily ]; then
            cp -R daily dist/daily
          fi
          if [ -d logos ]; then
            cp -R logos dist/logos
          fi
          if [ -d fonts ]; then
            cp -R fonts dist/fonts
          fi
          if [ -f data/fdco.json ]; then
            mkdir -p dist/data
            cp data/fdco.json dist/data/fdco.json
          fi
          if [ -f data/history.json ]; then
            mkdir -p dist/data
            cp data/history.json dist/data/history.json
          fi
          if [ -f data/rosters.json ]; then
            mkdir -p dist/data
            cp data/rosters.json dist/data/rosters.json
          fi
          if [ -f 404.html ]; then
            cp 404.html dist/404.html
          fi
          du -sh dist

      - name: 记录构建时间并归档
        run: |
          date -u +'{"generatedAt":"%Y-%m-%dT%H:%M:%SZ"}' > .last-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 赛前盘口快照必须入库：CI 每次全新 checkout，缓存里只有采集缓存。
          if [ -d odds_snapshots ]; then git add odds_snapshots; fi
          # 简报归档：只在新一期出现时提交（当天期在部署包里实时更新，
          # 次日首跑会把最终版本提交），避免每 30 分钟产生一条归档提交。
          BJ_TODAY=$(TZ=Asia/Shanghai date +%F)
          if ! git ls-tree -r --name-only HEAD daily 2>/dev/null | grep -qx "daily/$BJ_TODAY.html"; then
            git add daily
          fi
          if ! git diff --cached --quiet; then
            git commit -m "数据更新 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          fi
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
