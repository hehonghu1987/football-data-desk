name: 每日更新数据

on:
  schedule:
    # 每天 04:17 UTC（北京时间 12:17），覆盖前一晚欧洲与当天上午巴西的比赛
    - cron: "17 4 * * *"
    # 备用时段：GitHub 定时任务偶尔延迟或跳过，傍晚再补一次（北京时间 18:47）
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复采集缓存
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - name: 采集数据并生成页面
        run: python3 build_data.py --workers 6 --rate 0.1

      - name: 保存采集缓存
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}

      - name: 校验数据完整性
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/matches.json'))
          meta = d['meta']
          stats = sum(1 for m in d['matches'] if m.get('stats') or m.get('st'))
          print(meta['matchCount'], meta['teamCount'], meta['fixtureCount'], stats)
          import os
          assert meta['matchCount'] >= 12000, '比赛数据不完整，放弃发布'
          assert meta['teamCount'] >= 600, '球队数据不完整，放弃发布'
          assert stats >= 12000, '技术统计不完整，放弃发布'
          size = os.path.getsize('football_database.html')
          print('页面体积 %.2f MB' % (size / 1024 / 1024))
          assert size < 10 * 1024 * 1024, '页面体积超过 10MB，放弃发布'
          PY

      - name: 生成静态球队页
        run: python3 build_seo.py

      - name: 生成每日简报
        run: python3 build_daily.py

      - name: 整理发布目录
        run: |
          mkdir -p dist
          cp football_database.html dist/index.html
          cp sw.js dist/sw.js
          cp robots.txt sitemap.xml og-image.png og-icon.png dist/
          if [ -d seo/teams ]; then
            cp -R seo/teams dist/teams
            cp seo/sitemap.xml dist/sitemap.xml
          fi
          if [ -d daily ]; then
            cp -R daily dist/daily
          fi
          if [ -d logos ]; then
            cp -R logos dist/logos
          fi
          if [ -d fonts ]; then
            cp -R fonts dist/fonts
          fi
          du -sh dist

      - name: 记录构建时间并归档简报
        run: |
          date -u +'{"generatedAt":"%Y-%m-%dT%H:%M:%SZ"}' > .last-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build.json
          if [ -d odds_snapshots ]; then git add odds_snapshots; fi
          # 简报按日归档入库：CI 每次全新 checkout，不提交就会在下次部署时丢失往期
          if [ -d daily ]; then git add daily; fi
          git commit -m "每日数据更新 $(date -u +%F)" || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
