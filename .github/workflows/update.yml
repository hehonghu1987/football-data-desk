name: 每日更新数据

on:
  schedule:
    # 每天 04:17 UTC（北京时间 12:17），覆盖前一晚欧洲与当天上午巴西的比赛
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "仅部署已提交的页面，不重新采集"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 恢复采集缓存
        if: ${{ !inputs.deploy_only }}
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - name: 采集数据并生成页面
        if: ${{ !inputs.deploy_only }}
        run: python3 build_data.py --workers 6 --rate 0.1

      - name: 保存采集缓存
        if: ${{ always() && !inputs.deploy_only }}
        uses: actions/cache/save@v4
        with:
          path: cache
          key: espn-cache-${{ github.run_id }}

      - name: 校验数据完整性
        if: ${{ !inputs.deploy_only }}
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('data/matches.json'))
          meta = d['meta']
          print(meta['matchCount'], meta['teamCount'], meta['fixtureCount'])
          assert meta['matchCount'] >= 12000, '比赛数据不完整，放弃发布'
          assert meta['teamCount'] >= 600, '球队数据不完整，放弃发布'
          PY

      - name: 整理发布目录
        run: |
          mkdir -p dist
          cp football_database.html dist/index.html

      - name: 记录构建时间
        run: |
          date -u +'{"generatedAt":"%Y-%m-%dT%H:%M:%SZ"}' > .last-build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build.json
          git commit -m "每日数据更新 $(date -u +%F)" || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
